# Lightweight local deployment for the credential-pool fork.
#
# Start:
#   docker compose -f docker-compose.quickstart.yml up -d --build
#
# UI:
#   http://localhost:4444/admin
#
# Defaults are for local evaluation only. Override them with environment
# variables or a shell-exported .env file before using this on a shared host.

services:
  gateway:
    build:
      context: .
      dockerfile: Containerfile.lite
      args:
        ENABLE_RUST: "false"
        ENABLE_RUST_MCP_RMCP: "false"
    image: ${IMAGE_LOCAL:-contextforge-credential-pool:local}
    container_name: contextforge-credential-pool
    restart: unless-stopped
    ports:
      - "${MCPGATEWAY_PORT:-4444}:4444"
    environment:
      HOST: 0.0.0.0
      PORT: 4444
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:4444}
      TRANSPORT_TYPE: ${TRANSPORT_TYPE:-streamablehttp}
      DATABASE_URL: sqlite:////data/mcp.db
      CACHE_TYPE: ${CACHE_TYPE:-memory}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-true}
      MCP_CLIENT_AUTH_ENABLED: ${MCP_CLIENT_AUTH_ENABLED:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-ChangeMe123!}
      PLATFORM_ADMIN_FULL_NAME: ${PLATFORM_ADMIN_FULL_NAME:-Platform Administrator}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-dev-secret-at-least-32-bytes}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mcpgateway-api}
      JWT_ISSUER: ${JWT_ISSUER:-mcpgateway}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:-change-this-auth-encryption-secret-32b}
      REQUIRE_USER_IN_DB: ${REQUIRE_USER_IN_DB:-false}
      MCPGATEWAY_UI_ENABLED: ${MCPGATEWAY_UI_ENABLED:-true}
      MCPGATEWAY_ADMIN_API_ENABLED: ${MCPGATEWAY_ADMIN_API_ENABLED:-true}
      MCPGATEWAY_DIRECT_PROXY_ENABLED: ${MCPGATEWAY_DIRECT_PROXY_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - contextforge_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  contextforge_data:
